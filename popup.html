<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website A11y Checker</title>
  <style>
    :root {
      color-scheme: dark;

      --bg-app: #0f172a;
      --card-glass: rgb(30 41 59 / 78%);

      --text-heading: #f8fafc;
      --text-body: #dce3ee;
      --text-muted: #94a3b8;

      --accent-primary: #6366f1;
      --accent-primary-hover: #4f46e5;
      --accent-glow: rgb(99 102 241 / 35%);
      --accent-light: #a5b4fc;

      --critical: #f87171;
      --critical-bg: rgb(248 113 113 / 16%);
      --serious: #fb923c;
      --serious-bg: rgb(251 146 60 / 16%);
      --moderate: #facc15;
      --moderate-bg: rgb(250 204 21 / 16%);
      --minor: #60a5fa;
      --minor-bg: rgb(96 165 250 / 16%);
      --success: #34d399;
      --success-bg: rgb(52 211 153 / 16%);
      --on-tint: #0b1120;

      --card-border: rgb(255 255 255 / 14%);
      --card-border-hover: rgb(124 127 245 / 55%);

      --radius-pill: 999px;
      --radius-card: 14px;
      --radius-sm: 8px;

      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: var(--font-sans);
    }

    body {
      width: 390px;
      min-height: 530px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background-color: var(--bg-app);
      background-image: radial-gradient(circle at 50% 0%, rgb(99 102 241 / 15%), transparent 70%);
      color: var(--text-body);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
  width: 34px;
  height: 34px;
  background: #6366f1;
  color: #ffffff;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 14px rgb(99 102 241 / 40%);
  flex-shrink: 0;
}


    h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-heading);
      letter-spacing: -0.02em;
      color: var(--text-main);
      
    }

    button {
      width: 100%;
      padding: 12px;
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #scanBtn {
      background: var(--accent-primary);
      color: #ffffff;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    #scanBtn:hover {
      background: var(--accent-primary-hover);
      transform: translateY(-1px);
    }

    #exportBtn {
      background: rgb(255 255 255 / 3%);
      color: var(--text-heading);
      border: 1px solid var(--card-border);
    }

    #exportBtn:hover {
      background: rgb(255 255 255 / 8%);
      border-color: rgb(255 255 255 / 20%);
    }

    button:active {
      transform: scale(0.98);
    }

    .filter-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-glass);
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
    }

    .filter-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    #severityFilter {
      background: transparent;
      border: none;
      color: var(--accent-light);
      font-size: 12px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    #severityFilter:focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    #severityFilter option {
      background: #1e293b;
      color: var(--text-heading);
    }

    #result {
      background: var(--card-glass);
      border-radius: var(--radius-card);
      padding: 16px;
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      max-height: 380px;
      overflow-y: auto;
      font-size: 13px;
      color: var(--text-body);
      scrollbar-width: thin;
      scrollbar-color: rgb(255 255 255 / 15%) transparent;
    }

    h3, h4 {
      color: var(--text-heading);
      font-weight: 700;
    }

    h3 { font-size: 15px; margin-bottom: 10px; }
    h4 { font-size: 13px; margin-bottom: 10px; }

    hr {
      border: none;
      height: 1px;
      background: var(--card-border);
      margin: 14px 0;
    }

    .summary-grid, .severity-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0;
    }

    .summary-card, .severity-card {
      background: rgb(255 255 255 / 3%);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-card);
      padding: 12px;
      text-align: center;
      transition: all 0.25s ease;
    }

    .summary-card:hover, .severity-card:hover {
      border-color: var(--card-border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgb(0 0 0 / 25%);
    }

    .summary-number, .severity-count {
      font-size: 20px;
      font-weight: 800;
    }

    .summary-label, .severity-title {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 4px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .severity-card.critical, .summary-card.violations {
      background: var(--critical-bg);
      border-color: rgb(239 68 68 / 30%);
    }
    .severity-card.critical .severity-count, .summary-card.violations .summary-number { color: var(--critical); }

    .severity-card.serious {
      background: var(--serious-bg);
      border-color: rgb(249 115 22 / 30%);
    }
    .severity-card.serious .severity-count { color: var(--serious); }

    .severity-card.moderate, .summary-card.incomplete {
      background: var(--moderate-bg);
      border-color: rgb(234 179 8 / 30%);
    }
    .severity-card.moderate .severity-count, .summary-card.incomplete .summary-number { color: var(--moderate); }

    .severity-card.minor, .summary-card.inapplicable {
      background: var(--minor-bg);
      border-color: rgb(59 130 246 / 30%);
    }
    .severity-card.minor .severity-count, .summary-card.inapplicable .summary-number { color: var(--minor); }

    .summary-card.passes {
      background: var(--success-bg);
      border-color: rgb(16 185 129 / 30%);
    }
    .summary-card.passes .summary-number { color: var(--success); }

    .issue {
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-card);
      background: rgb(15 23 42 / 65%);
      transition: border-color 0.2s ease;
    }

    .issue:hover {
      border-color: var(--card-border-hover);
    }

    .issue-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-heading);
      margin-bottom: 4px;
    }

    .issue-description {
      font-size: 12px;
      color: var(--text-body);
      line-height: 1.4;
    }

    .issue-wcag {
      display: flex;
      gap: 6px;
      margin: 8px 0;
    }

    .wcag-criteria, .wcag-level {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
    }

    .wcag-criteria {
      background: rgb(99 102 241 / 22%);
      color: var(--accent-light);
    }

    .wcag-level {
      background: rgb(255 255 255 / 10%);
      color: var(--text-muted);
    }

    .remediation-box {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      background: rgb(99 102 241 / 10%);
      border-left: 3px solid var(--accent-primary);
    }

    .remediation-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-light);
      margin-bottom: 2px;
    }

    .remediation-text {
      font-size: 11px;
      color: var(--text-body);
      line-height: 1.4;
    }

    .highlight-element-btn {
      margin-top: 8px;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      background: rgb(255 255 255 / 5%);
      border: 1px solid var(--card-border);
      color: var(--text-heading);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
    }

    .highlight-element-btn:hover {
      background: rgb(255 255 255 / 10%);
      border-color: rgb(255 255 255 / 20%);
    }

    .badge {
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      color: var(--on-tint);
      letter-spacing: 0.02em;
    }

    .critical { background: var(--critical); }
    .serious { background: var(--serious); }
    .moderate { background: var(--moderate); }
    .minor { background: var(--minor); }

    .learn-more-link {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-light);
      text-decoration: none;
    }

    .learn-more-link:hover {
      text-decoration: underline;
    }

    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgb(255 255 255 / 15%);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgb(255 255 255 / 25%);
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
           <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      </div>
      <h2>A11y Inspector</h2>
    </div>
  </div>

  <button id="scanBtn" type="button">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>    Scan Website
  </button>

  <div class="filter-container">
    <span class="filter-label" id="severityFilterLabel">Filter Severity</span>
    <select id="severityFilter" aria-labelledby="severityFilterLabel">
      <option value="all">All Issues</option>
      <option value="critical">Critical</option>
      <option value="serious">Serious</option>
      <option value="moderate">Moderate</option>
      <option value="minor">Minor</option>
    </select>
  </div>

  <div id="result" role="status" aria-live="polite">
    Click <b>Scan Website</b> to  run accessibility analysis.
  </div>

  <button id="exportBtn" type="button">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    Export Report (.JSON)
  </button>

  <script src="popup.js" defer></script>
</body>
</html>
