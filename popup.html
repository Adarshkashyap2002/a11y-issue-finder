<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Website A11y Checker</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        width: 400px;
        min-height: 500px;
        padding: 18px;
        background: #f5f5f5;
      }

      h2 {
        text-align: center;
        color: #222;
        margin-bottom: 18px;
      }

      #scanBtn,
      #exportBtn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.25s;
      }

      #scanBtn {
        width: 100%;
        background: #2563eb;
      }
      #exportBtn {
        width: 100%;
        margin-top: 12px;
        background: #16a34a;
      }

      #exportBtn:hover {
        background: #15803d;
      }

      #scanBtn:hover {
        background: #1d4ed8;
      }

      #scanBtn:focus-visible,
      #exportBtn:focus-visible,
      #severityFilter:focus-visible,
      .learn-more-link:focus-visible {
        outline: 3px solid #111827;
        outline-offset: 2px;
      }

      #result {
        margin-top: 18px;
        background: white;
        border-radius: 10px;
        padding: 15px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        max-height: 430px;
        overflow-y: auto;
      }

      h3 {
        margin-bottom: 15px;
        color: #222;
      }

      .summary {
        margin-bottom: 8px;
        font-size: 15px;
      }

      hr {
        margin: 15px 0;
      }

      h4 {
        margin-bottom: 12px;
        color: #111;
      }

      .issue {
        padding: 12px;
        margin-bottom: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: #fafafa;
      }

      .issue-title {
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 8px;
      }

      .issue-description {
        font-size: 14px;
        color: #555;
        line-height: 1.5;
      }
      .issue-highlight-wrapper {
    margin-top: 12px;
}

.highlight-element-btn {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #2563eb;
    border-radius: 6px;
    background: #eff6ff;
    color: #2563eb;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.highlight-element-btn:hover {
    background: #dbeafe;
}

      .issue-meta {
        margin: 10px 0;
      }

      .issue-learn-more {
        margin-top: 12px;
      }

      .learn-more-link {
        text-decoration: none;
        color: #2563eb;
        font-weight: bold;
      }

      .learn-more-link[aria-disabled="true"] {
        color: #6b7280;
        pointer-events: none;
        text-decoration: line-through;
      }

      .error-text {
        color: #b91c1c;
        font-weight: 600;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 18px;
      }

      .summary-card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-left: 5px solid #ddd;
        border-radius: 10px;
        padding: 15px;
        text-align: center;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        transition: 0.25s ease;
        cursor: default;
      }

      .summary-card:hover {
        transform: translateY(-2px);

        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
      }

      .summary-card.violations {
        border-left-color: #dc2626;
      }

      .summary-card.passes {
        border-left-color: #16a34a;
      }

      .summary-card.incomplete {
        border-left-color: #ca8a04;
      }

      .summary-card.inapplicable {
        border-left-color: #2563eb;
      }
      .summary-card.violations .summary-icon {
        color: #dc2626;
      }

      .summary-card.passes .summary-icon {
        color: #16a34a;
      }

      .summary-card.incomplete .summary-icon {
        color: #ca8a04;
      }

      .summary-card.inapplicable .summary-icon {
        color: #2563eb;
      }
      .summary-icon {
        font-size: 24px;
        margin-bottom: 8px;
      }

      .summary-number {
        font-size: 24px;
        font-weight: bold;
        color: #111;
      }

      .summary-label {
        margin-top: 6px;
        color: #666;
        font-size: 15px;
        font-weight: 600;
      }

      .summary-card.violations .summary-number {
        color: #dc2626;
      }

      .summary-card.passes .summary-number {
        color: #16a34a;
      }

      .summary-card.incomplete .summary-number {
        color: #ca8a04;
      }

      .summary-card.inapplicable .summary-number {
        color: #2563eb;
      }

      /* ===== Impact Badge Styles ===== */

      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 20px;
        color: white;
        font-size: 12px;
        font-weight: bold;
        margin-left: 5px;
      }

      .critical {
        background: #dc2626;
      }

      .serious {
        background: #ea580c;
      }

      .moderate {
        background: #ca8a04;
      }

      .minor {
        background: #2563eb;
      }

      .unknown {
        background: #6b7280;
      }

      /* Scrollbar */

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-thumb {
        background: #c5c5c5;
        border-radius: 20px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #999;
      }

      .severity-summary {
        margin-top: 18px;
        margin-bottom: 18px;
      }

      .severity-item {
        display: flex;
        justify-content: space-between;
        align-items: center;

        padding: 10px 12px;

        margin-bottom: 8px;

        border-radius: 8px;

        font-weight: bold;

        color: #333;

        background: #f8f8f8;
      }
      .severity-grid {
        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 10px;

        margin-top: 15px;

        margin-bottom: 15px;
      }

      .severity-card {
        background: white;

        border: 1px solid #e5e7eb;

        border-left: 5px solid #ddd;

        border-radius: 10px;

        padding: 12px;

        text-align: center;

        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);

        transition: 0.25s;
      }

      .severity-card:hover {
        transform: translateY(-2px);

        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.12);
      }

      .severity-count {
        font-size: 22px;

        font-weight: bold;

        margin-top: 8px;
      }

      .severity-title {
        margin-top: 6px;

        font-size: 14px;

        color: #555;
      }
      .severity-card.critical {
        border-left-color: #dc2626;
      }

      .severity-card.serious {
        border-left-color: #ea580c;
      }

      .severity-card.moderate {
        border-left-color: #ca8a04;
      }

      .severity-card.minor {
        border-left-color: #2563eb;
      }

      .severity-item span {
        font-size: 16px;
      }

      .severity-item.critical {
        border-left: 5px solid #dc2626;
      }

      .severity-item.serious {
        border-left: 5px solid #ea580c;
      }

      .severity-item.moderate {
        border-left: 5px solid #ca8a04;
      }

      .severity-item.minor {
        border-left: 5px solid #2563eb;
      }

      .filter-container {
        margin: 15px 0;
      }

      .filter-label {
        font-weight: 700;
      }

      #severityFilter {
        width: 100%;
        padding: 8px;
        margin-top: 6px;
        border-radius: 6px;
      }
    </style>
  </head>

  <body>
    <h2>Website A11y Checker</h2>

    <button id="scanBtn" type="button">Scan Website</button>

    <div class="filter-container">
      <label class="filter-label" for="severityFilter">Filter Issues</label>

      <select id="severityFilter">
        <option value="all">All</option>
        <option value="critical">Critical</option>
        <option value="serious">Serious</option>
        <option value="moderate">Moderate</option>
        <option value="minor">Minor</option>
      </select>
    </div>

    <div id="result" role="status" aria-live="polite">
      Click <b>Scan Website</b> to analyze the current webpage.
    </div>

    <button id="exportBtn" type="button">⬇ Export JSON</button>

    <script src="popup.js"></script>
  </body>
</html>
