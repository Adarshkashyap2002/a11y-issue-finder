<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website A11y Checker</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            width:400px;
            min-height:500px;
            padding:18px;
            background:#f5f5f5;
        }

        h2{
            text-align:center;
            color:#222;
            margin-bottom:18px;
        }

        #scanBtn{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:.25s;
        }

        #scanBtn:hover{
            background:#1d4ed8;
        }

        #result{
            margin-top:18px;
            background:white;
            border-radius:10px;
            padding:15px;
            box-shadow:0 2px 8px rgba(0,0,0,.12);
            max-height:430px;
            overflow-y:auto;
        }

        h3{
            margin-bottom:15px;
            color:#222;
        }

        .summary{
            margin-bottom:8px;
            font-size:15px;
        }

        hr{
            margin:15px 0;
        }

        h4{
            margin-bottom:12px;
            color:#111;
        }

        .issue{
            padding:12px;
            margin-bottom:12px;
            border:1px solid #ddd;
            border-radius:8px;
            background:#fafafa;
        }

        .issue-title{
            font-size:15px;
            font-weight:bold;
            margin-bottom:8px;
        }

        .issue-description{
            font-size:14px;
            color:#555;
            line-height:1.5;
        }

        /* ===== Impact Badge Styles ===== */

        .badge{
            display:inline-block;
            padding:4px 10px;
            border-radius:20px;
            color:white;
            font-size:12px;
            font-weight:bold;
            margin-left:5px;
        }

        .critical{
            background:#dc2626;
        }

        .serious{
            background:#ea580c;
        }

        .moderate{
            background:#ca8a04;
        }

        .minor{
            background:#2563eb;
        }

        .unknown{
            background:#6b7280;
        }

        /* Scrollbar */

        ::-webkit-scrollbar{
            width:8px;
        }

        ::-webkit-scrollbar-thumb{
            background:#c5c5c5;
            border-radius:20px;
        }

        ::-webkit-scrollbar-thumb:hover{
            background:#999;
        }

    </style>

</head>

<body>

    <h2>Website A11y Checker</h2>

    <button id="scanBtn">
        Scan Website
    </button>

    <div id="result">
        Click <b>Scan Website</b> to analyze the current webpage.
    </div>

    <script src="popup.js"></script>

</body>

</html>
